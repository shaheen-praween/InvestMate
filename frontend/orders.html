<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestMate - Orders</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Top navbar -->
  <nav class="navbar">
    <span class="logo">InvestMate</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/markets">Markets</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/orders" class="active">Orders</a>
    </div>
    <div class="nav-right">
      <span id="navUserName"></span>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
    </div>
  </nav>

  <div class="container">
    <!-- Error message yahan dikhega -->
    <div id="alertBox" class="alert"></div>

    <div class="card">
      <h2>Order history</h2>

      <!-- Tabs: All / Buy / Sell -->
      <div class="tabs">
        <button class="tab active" data-type="">All</button>
        <button class="tab" data-type="BUY">Buy</button>
        <button class="tab" data-type="SELL">Sell</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Stock</th>
              <th>Type</th>
              <th class="num">Qty</th>
              <th class="num">Price</th>
              <th class="num">Total</th>
              <th class="num">Realized P/L</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <p id="emptyText">You have not placed any orders yet.</p>
        <p><a href="/markets" class="back-link">Go to Markets</a></p>
      </div>

      <div id="pagination" class="pagination" hidden>
        <button id="prevBtn" class="btn btn-outline">&larr; Previous</button>
        <span id="pageInfo" class="muted"></span>
        <button id="nextBtn" class="btn btn-outline">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Pehle api.js (helpers), phir is page ki apni JS -->
  <script src="/js/api.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
