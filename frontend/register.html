<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestMate - Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>InvestMate</h1>
      <p class="subtitle">Create your account and get ₹1,00,000 virtual cash</p>

      <!-- Error / success message yahan dikhega -->
      <div id="alertBox" class="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" required>
        </div>

        <button type="submit" id="submitBtn" class="btn">Register</button>
      </form>

      <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
    </div>
  </div>

  <!-- Pehle api.js (helpers), phir is page ki apni JS -->
  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
