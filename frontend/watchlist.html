<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestMate - Watchlist</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Top navbar -->
  <nav class="navbar">
    <span class="logo">InvestMate</span>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/markets">Markets</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/orders">Orders</a>
      <a href="/watchlist" class="active">Watchlist</a>
    </div>
    <div class="nav-right">
      <span id="navUserName"></span>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
    </div>
  </nav>

  <div class="container">
    <!-- Error message yahan dikhega -->
    <div id="alertBox" class="alert"></div>

    <!-- Naya stock dhundh ke add karne ka box -->
    <div class="card">
      <h2>Add a stock to your watchlist</h2>
      <div class="toolbar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by symbol or company name" maxlength="50" autocomplete="off">
      </div>
      <div id="searchResults"></div>
    </div>

    <div class="card">
      <h2>Your watchlist</h2>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Company</th>
              <th>Sector</th>
              <th class="num">Price</th>
              <th class="num">Change</th>
              <th class="num">Change %</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="watchlistBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <p>Your watchlist is empty. Search above to add stocks you want to track.</p>
      </div>
    </div>
  </div>

  <!-- Pehle api.js (helpers), phir is page ki apni JS -->
  <script src="/js/api.js"></script>
  <script src="/js/watchlist.js"></script>
</body>
</html>
